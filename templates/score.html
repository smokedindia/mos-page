<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Samples - Page {{ page }}</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .task-type {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
            text-align: center;
        }

        .page-number {
            font-size: 1.2em;
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        .prompt-container {
            background-color: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 4px;
        }

        .prompt-label {
            font-weight: bold;
            color: #1976D2;
            margin-bottom: 5px;
        }

        .prompt-text {
            color: #333;
            line-height: 1.6;
        }

        .video-comparison {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .video-panel {
            flex: 1;
            max-width: 500px;
        }

        .video-label {
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #555;
        }

        video {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            background-color: #000;
        }

        .scoring-section {
            margin-top: 40px;
        }

        .criterion-row {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .criterion-row:last-child {
            border-bottom: none;
        }

        .criterion-label {
            flex: 0 0 220px;
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
        }

        .criterion-options {
            flex: 1;
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .radio-option input[type="radio"] {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            cursor: pointer;
        }

        .radio-option label {
            font-size: 1.1em;
            cursor: pointer;
            user-select: none;
        }

        .error-message {
            color: red;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .next-button {
            display: block;
            margin: 30px auto 0;
            padding: 15px 40px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .next-button:hover {
            background-color: #1976D2;
        }

        .next-button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        @media (max-width: 900px) {
            .video-comparison {
                flex-direction: column;
            }

            .criterion-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .criterion-label {
                flex: none;
            }

            .criterion-options {
                width: 100%;
                justify-content: flex-start;
                gap: 20px;
            }
        }
    </style>
    <script>
        function updateButtonState() {
            const textConsistency = document.querySelector('input[name="text_consistency"]:checked');
            const audioVideoAlignment = document.querySelector('input[name="audio_video_alignment"]:checked');
            const overallQuality = document.querySelector('input[name="overall_quality"]:checked');

            const submitButton = document.getElementById('submitButton');
            submitButton.disabled = !(textConsistency && audioVideoAlignment && overallQuality);
        }

        window.onload = function () {
            // Add event listeners to all radio buttons
            const radios = document.querySelectorAll('input[type="radio"]');
            radios.forEach(radio => {
                radio.addEventListener('change', updateButtonState);
            });

            // Initial button state check
            updateButtonState();
        };
    </script>
</head>

<body>
    <div class="container">
        <div class="task-type">{{ task_type }}</div>
        <div class="page-number">Page {{ page }} of {{ total_pages }}</div>

        <div class="prompt-container">
            <div class="prompt-label">Prompt:</div>
            <div class="prompt-text">{{ sample.prompt }}</div>
        </div>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="error-message">
            {% for message in messages %}
            <p>{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <div class="video-comparison">
            <!-- <p><strong>{{ sample.left.model_name }}</strong></p> -->
            <div class="video-panel">
                <video controls>
                    <source src="{{ url_for('static', filename=sample.left.file_path) }}" type="video/mp4">
                    Your browser does not support the video element.
                </video>
            </div>

            <!-- <p><strong>{{ sample.right.model_name }}</strong></p> -->
            <div class="video-panel">
                <video controls>
                    <source src="{{ url_for('static', filename=sample.right.file_path) }}" type="video/mp4">
                    Your browser does not support the video element.
                </video>
            </div>
        </div>

        <form method="POST">
            <!-- Hidden fields to preserve which model is on which side -->
            <input type="hidden" name="left_model" value="{{ sample.left.model_name }}">
            <input type="hidden" name="right_model" value="{{ sample.right.model_name }}">

            <div class="scoring-section">
                <div class="criterion-row">
                    <div class="criterion-label">Text-Consistency</div>
                    <div class="criterion-options">
                        <div class="radio-option">
                            <input type="radio" id="tc_left" name="text_consistency" value="left_win">
                            <label for="tc_left">Left better</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="tc_tie" name="text_consistency" value="tie">
                            <label for="tc_tie">Tie</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="tc_right" name="text_consistency" value="right_win">
                            <label for="tc_right">Right better</label>
                        </div>
                    </div>
                </div>

                <div class="criterion-row">
                    <div class="criterion-label">Audio-Video Alignment</div>
                    <div class="criterion-options">
                        <div class="radio-option">
                            <input type="radio" id="ava_left" name="audio_video_alignment" value="left_win">
                            <label for="ava_left">Left better</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="ava_tie" name="audio_video_alignment" value="tie">
                            <label for="ava_tie">Tie</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="ava_right" name="audio_video_alignment" value="right_win">
                            <label for="ava_right">Right better</label>
                        </div>
                    </div>
                </div>

                <div class="criterion-row">
                    <div class="criterion-label">Overall Quality</div>
                    <div class="criterion-options">
                        <div class="radio-option">
                            <input type="radio" id="oq_left" name="overall_quality" value="left_win">
                            <label for="oq_left">Left better</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="oq_tie" name="overall_quality" value="tie">
                            <label for="oq_tie">Tie</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="oq_right" name="overall_quality" value="right_win">
                            <label for="oq_right">Right better</label>
                        </div>
                    </div>
                </div>
            </div>

            <button type="submit" id="submitButton" class="next-button" disabled>Next Page</button>
        </form>
    </div>
</body>

</html>
